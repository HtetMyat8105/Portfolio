{% extends "base.html" %}
{% block content %}
<div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Manage Projects (CRUD)</h1>
        <a href="{{ url_for('admin_dashboard') }}" class="btn" style="background: #334155; color: white;">Back to Dashboard</a>
    </div>

    <!-- Add Project Form -->
    <form method="POST" class="contact-form" style="max-width: 100%; margin-bottom: 3rem;">
        <h3 style="margin-bottom: 1rem; color: #38bdf8;">Add New Project</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
            <div class="form-group"><label>Title</label><input type="text" name="title" required></div>
            <div class="form-group"><label>Subtitle</label><input type="text" name="subtitle"></div>
            <div class="form-group"><label>Technologies</label><input type="text" name="tech" placeholder="Python, Flask"></div>
            <div class="form-group"><label>GitHub Link</label><input type="text" name="github"></div>
            <div class="form-group"><label>Demo Link</label><input type="text" name="demo"></div>
        </div>
        <div class="form-group"><label>Description</label><textarea name="description" rows="3"></textarea></div>
        <button type="submit" class="btn primary-btn">Add Project</button>
    </form>

    <!-- Existing Projects List -->
    <h3>Existing Projects</h3>
    <div class="projects-grid" style="margin-top: 1rem;">
        {% for p in projects %}
        <div class="project-card">
            <h3>{{ p.title }}</h3>
            <p style="color: #a855f7; font-size: 0.85rem;">{{ p.subtitle }}</p>
            <p style="color: #9ca3af; font-size: 0.9rem; margin: 0.5rem 0;">{{ p.description }}</p>
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                <a href="{{ url_for('edit_project', id=p.id) }}" class="btn" style="background: #38bdf8; color: #0b0f19; padding: 0.4rem 0.8rem; font-size: 0.85rem;">Edit</a>
                <a href="{{ url_for('delete_project', id=p.id) }}" class="btn" style="background: #ef4444; color: white; padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="return confirm('Are you sure?')">Delete</a>
            </div>
        </div>
        {% else %}
        <p style="color: #9ca3af;">No projects found.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
