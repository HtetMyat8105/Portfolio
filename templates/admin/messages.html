{% extends "base.html" %}
{% block content %}
<div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Contact Messages</h1>
        <a href="{{ url_for('admin_dashboard') }}" class="btn" style="background: #334155; color: white;">Back to Dashboard</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 1rem;">
        {% for msg in messages %}
        <div class="project-card" style="width: 100%;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <h3 style="color: #38bdf8;">{{ msg.name }}</h3>
                <span style="color: #9ca3af; font-size: 0.85rem;">{{ msg.email }}</span>
            </div>
            <p style="color: #cbd5e1;">{{ msg.message }}</p>
        </div>
        {% else %}
        <p style="color: #9ca3af;">No messages received yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
