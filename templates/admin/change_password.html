{% extends "base.html" %}
{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h1>Change Password</h1>
        <a href="{{ url_for('admin_dashboard') }}" class="btn" style="background: #334155; color: white;">Back</a>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}<p style="color: {% if cat == 'success' %}#10b981{% else %}#ef4444{% endif %}; margin-bottom: 1rem;">{{ msg }}</p>{% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="contact-form" style="max-width: 100%;">
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" required placeholder="Enter current password">
        </div>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" required placeholder="Enter new password">
        </div>
        <button type="submit" class="btn primary-btn">Update Password</button>
    </form>
</div>
{% endblock %}
