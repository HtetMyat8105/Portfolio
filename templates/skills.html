{% extends "base.html" %}
{% block content %}
<section>
    <h1>Skills & Experience</h1>
    <div class="skills-grid">
        {% for category, items in skills.items() %}
        <div class="skill-card">
            <h3 style="color: #38bdf8; margin-bottom: 1rem;">{{ category }}</h3>
            <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.6rem;">
                {% for item in items %}
                <li style="background: rgba(15, 23, 42, 0.5); padding: 0.5rem 1rem; border-radius: 8px; color: #cbd5e1;">{{ item }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
